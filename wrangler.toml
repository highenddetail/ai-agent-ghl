name = "hed-ai-agent"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Pricing knowledge base is bundled as plain text.
rules = [{ type = "Text", globs = ["**/*.md"], fallthrough = true }]

[observability]
enabled = true

# One Durable Object per contact: debounces bursts of messages and makes sure
# a contact never gets two replies at the same time. SQLite-backed classes are
# available on the Workers Free plan.
[[durable_objects.bindings]]
name = "CONVERSATIONS"
class_name = "ConversationAgent"

[[durable_objects.bindings]]
name = "EVENTS"
class_name = "EventLog"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationAgent"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["EventLog"]

[vars]
GHL_LOCATION_ID = "5VcUBfcIPjOMb1VX5OoS"
TIMEZONE = "America/New_York"
CLAUDE_MODEL = "claude-sonnet-5-5"
CLAUDE_EFFORT = "medium"
BOOKING_LINK = "https://links.highenddetail.com/widget/service-menu/6a9f2a95377a537eac51a886"
# Rollout controls. While ONLY_TAG is set, the agent only answers contacts with that tag.
# Set it to "" to answer every SMS/Instagram conversation.
ONLY_TAG = ""
# "true" = write the proposed reply as a contact note instead of sending it.
DRY_RUN = "false"
# Contacts with any of these tags are never answered by the agent.
STOP_TAGS = "stop bot,ai-escalated"
ESCALATION_TAG = "ai-escalated"
BUYING_INTENT_TAG = "ai-buying-intent"
# Wait this long after the last customer message before replying (people often send several texts in a row).
DEBOUNCE_SECONDS = "7"
# Stay quiet if a team member replied manually within this many minutes.
HUMAN_PAUSE_MINUTES = "5"
# Shop policy: cancellations and reschedules need this much notice; closer than this goes to the team.
CHANGE_NOTICE_HOURS = "24"
# Square deposit links: percentage of the booked services' catalog price.
SQUARE_LOCATION_ID = "032SR1A1XRP3E"
DEPOSIT_PERCENT = "10"
DEPOSIT_PENDING_TAG = "deposito-pendiente"
DEPOSIT_PAID_TAG = "deposito-pagado"
# Follow-ups when a customer stops answering. "on" = send, "draft" = write them as contact notes only, "off" = disabled.
FOLLOWUPS = "on"
# Delays after Julia's last unanswered message. The sequence stops after the last one.
FOLLOWUP_SCHEDULE = "1h,1d,2d,7d,30d"
# Follow-ups only go out Monday to Saturday between these hours (Miami time), never Sundays.
FOLLOWUP_HOURS = "8-18"
# Added when the customer asks not to be messaged again; Julia still answers if they write first.
FOLLOWUP_OPTOUT_TAG = "no-follow-up"

# Secrets (set with `npx wrangler secret put <NAME>`):
#   ANTHROPIC_API_KEY  - Claude API key
#   GHL_TOKEN          - GoHighLevel Private Integration token
#   WEBHOOK_SECRET     - shared secret appended to the webhook URL as ?key=...
#   SQUARE_ACCESS_TOKEN          - Square production access token (payment links)
#   SQUARE_WEBHOOK_SIGNATURE_KEY - signature key of the Square webhook subscription (payment.updated)
